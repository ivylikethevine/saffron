services:
  octoprint:
    image: octoprint/octoprint:1.11.8
    pull_policy: missing
    container_name: octoprint
    restart: unless-stopped
    ports:
      - 85:80
    volumes:
      - /containers/octoprint:/octoprint
    privileged: true
    extends:
      file: ../common.yaml
      service: base-settings
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:80/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
