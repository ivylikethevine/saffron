services:
  ustreamer:
    image: pikvm/ustreamer:v6.66
    pull_policy: missing
    container_name: ustreamer
    labels:
      homepage.group: Home
      homepage.name: uStreamer
      homepage.icon: mdi-cctv
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8083
      homepage.description: IP camera
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8083:8080
    command: ustreamer --device /dev/video0 -b 32 -w 32 -r 1280x720 -q 60
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
