services:
  heimdall:
    image: linuxserver/heimdall:2.8.2
    pull_policy: missing
    container_name: heimdall
    restart: unless-stopped
    extends:
      file: ../common.yaml
      service: base-settings
    ports:
      - 80:80
      - 443:443
    volumes:
      - /containers/heimdall:/config
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:80/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
