services:
  # Not extended from base-settings: no-new-privileges and the /etc/localtime mount
  # are untested against Android's init.
  redroid:
    image: &redroid-image erstt/redroid:13.0.0_ndk_ChromeOS
    container_name: redroid
    privileged: true
    restart: "no"
    logging:
      options:
        max-size: 10m
        max-file: "3"
    # No swap: a container thrashing swap stalls the whole host.
    mem_limit: ${REDROID_MEM_LIMIT:-3g}
    memswap_limit: ${REDROID_MEM_LIMIT:-3g}
    shm_size: 1g
    ports:
      - 127.0.0.1:5555:5555
    volumes:
      - /containers/instadroid/android:/data
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
      - androidboot.redroid_height=${REDROID_HEIGHT:-2340}
      - androidboot.redroid_dpi=${REDROID_DPI:-420}
      - androidboot.redroid_fps=30
      - androidboot.use_memfd=true
    # Boot takes 1-9 minutes on this image.
    healthcheck:
      test:
        - CMD
        - /system/bin/sh
        - -c
        - '[ "$$(/system/bin/getprop sys.boot_completed)" = 1 ]'
      interval: 60s
      timeout: 10s
      start_period: 10m
      retries: 3
  instadroid:
    image: ghcr.io/ivylikethevine/instadroid:v0.1.3
    container_name: instadroid
    extends:
      file: ../common.yaml
      service: base-settings
    restart: "no"
    labels:
      homepage.group: Web
      homepage.name: instadroid
      homepage.icon: instagram.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8000
      homepage.description: Instagram to RSS
    depends_on:
      redroid:
        condition: service_started
    # Reaches redroid's ADB on 127.0.0.1:5555; the feed binds FEED_HOST:FEED_PORT.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      REDROID_IMAGE: *redroid-image
      IG_AUTO_INSTALL: 1
    volumes:
      - /containers/instadroid/db:/db
      - /containers/instadroid/media:/media
      - /containers/instadroid/debug:/debug
      - /containers/instadroid/apk:/apk
    mem_limit: 256m
    memswap_limit: 256m
    # The image's own healthcheck probes /health.
networks: {}
