name: Compose Validation

on:
  push:
    branches: [main]
    paths:
      - 'stacks/**'
  pull_request:
    branches: [main]
    paths:
      - 'stacks/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate compose file syntax
        run: |
          cp stacks/common.yaml.public stacks/common.yaml
          for file in stacks/*/compose.yaml; do
            echo "Validating $file..."
            docker compose -f "$file" config > /dev/null || exit 1
          done
          echo "✓ All compose files are valid"

      - name: Check every stack has a README and is listed in stacks/README.md
        run: |
          fail=0
          for dir in stacks/*/; do
            stack=$(basename "$dir")
            if [ ! -f "$dir/README.md" ]; then
              echo "✗ Missing README.md: $dir"
              fail=1
            fi
            if ! grep -q "](stacks/$stack/README.md)" stacks/README.md; then
              echo "✗ stacks/README.md does not list $stack"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ Every stack has a README.md and an index entry"

      - name: Check .env.public documents every variable
        run: |
          # USER, HOMEPAGE_HOST and SAFFRON_DIR come from the host or dockge environment, not .env
          fail=0
          for file in stacks/*/compose.yaml; do
            dir=$(dirname "$file")
            for v in $(grep -oE '\$\{?[A-Z_][A-Z0-9_]*' "$file" | tr -d '${' | sort -u); do
              case "$v" in USER|HOMEPAGE_HOST|SAFFRON_DIR) continue ;; esac
              if [ ! -f "$dir/.env.public" ] || ! grep -qE "^#? ?$v=" "$dir/.env.public"; then
                echo "✗ $file uses \$$v but $dir/.env.public does not document it"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ Every compose variable is documented in its .env.public"

      - name: Reject obsolete version keys
        run: |
          for file in stacks/*/compose.yaml; do
            if grep -q '^version:' "$file"; then
              echo "✗ Obsolete version key in $file (Compose v2 ignores it and warns)"
              exit 1
            fi
          done
          echo "✓ No compose file sets a version key"
