version: "3.8"
services:
  lidarr:
    image: linuxserver/lidarr:3.1.3-nightly
    pull_policy: missing
    container_name: lidarr
    restart: always
    ports:
      - 8686:8686
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/lidarr:/config
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - servarr_bridge
networks:
  servarr_bridge:
    external: true
