services:
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:v0.10.1
    container_name: bitmagnet
    extends:
      file: ../common.yaml
      service: base-settings
    labels:
      homepage.group: Indexing
      homepage.name: Bitmagnet
      homepage.icon: bitmagnet.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:3333
      homepage.description: DHT crawler
    network_mode: service:bitmagnet-gluetun
    environment:
      POSTGRES_HOST: bitmagnet-postgres
      POSTGRES_PASSWORD: $POSTGRES_PW
      CLASSIFIER_DELETE_XXX: true
    volumes:
      - /containers/bitmagnet:/root/.config/bitmagnet
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      bitmagnet-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:3333/metrics
  bitmagnet-gluetun:
    container_name: bitmagnet-gluetun
    extends:
      file: ../common.yaml
      service: base-settings
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    ports:
      - 3333:3333 # Bitmagnet UI
      - 3334:3334/tcp # Bitmagnet torrent
      - 3334:3334/udp # Bitmagnet torrent
      - 5030:5030 # Slskd WebUI
      - 13612:13612 # Slkskd (Port Forwarded)
    environment:
      VPN_TYPE: wireguard
      UPDATER_PERIOD: 24h
      VPN_SERVICE_PROVIDER: $PROVIDER
      WIREGUARD_PRIVATE_KEY: $PRIVATE_KEY
      WIREGUARD_PRESHARED_KEY: $PRESHARED_KEY
      WIREGUARD_ADDRESSES: $ADDRESSES
      SERVER_REGIONS: $REGIONS
      FIREWALL_VPN_INPUT_PORTS: 13612
      VPN_PORT_FORWARDING_LISTENING_PORT: 13612
    devices:
      - /dev/net/tun:/dev/net/tun
    extra_hosts:
      - bitmagnet-postgres:5.5.5.2
    networks:
      bridge:
        ipv4_address: 5.5.5.1
      servarr_bridge: {}
  bitmagnet-postgres:
    image: postgres:16.15-alpine
    container_name: bitmagnet-postgres
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/bitmagnet/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PW
      POSTGRES_DB: bitmagnet
      PGUSER: postgres
    shm_size: 1g
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
      start_period: 20s
      interval: 10s
    networks:
      bridge:
        ipv4_address: 5.5.5.2
    ports:
      - 5432:5432
networks:
  bridge:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 5.5.5.0/24
          gateway: 5.5.5.4
  servarr_bridge:
    external: true
