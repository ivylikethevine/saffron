services:
  docsify:
    build:
      context: .
      network: host
    container_name: docsify
    labels:
      homepage.group: Infrastructure
      homepage.name: Docsify
      homepage.icon: docsify.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:3005
      homepage.description: This wiki
    ports:
      - 3005:3000
    volumes:
      - ${SAFFRON_DIR:-../..}:/saffron:ro
    extends:
      file: ../common.yaml
      service: base-settings
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
