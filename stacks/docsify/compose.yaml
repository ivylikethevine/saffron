services:
  docsify:
    build:
      context: .
      network: host
    container_name: docsify
    restart: unless-stopped
    ports:
      - 3005:3000
    volumes:
      - /home/$USER/saffron:/saffron:ro
    extends:
      file: ../common.yaml
      service: base-settings
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
