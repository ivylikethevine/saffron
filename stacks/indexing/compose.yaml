services:
  prowlarr:
    image: linuxserver/prowlarr:nightly-2.6.2.5548-ls10
    pull_policy: missing
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - 9696:9696
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/prowlarr:/config
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:9696/ping
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - servarr_bridge
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.0
    pull_policy: missing
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - 8191:8191
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8191/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - servarr_bridge
  byparr:
    container_name: byparr
    image: ghcr.io/thephaseless/byparr:3.0.4
    pull_policy: missing
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - 8192:8191
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - servarr_bridge
networks:
  servarr_bridge:
    external: true
