services:
  lidarr:
    image: linuxserver/lidarr:3.1.3-nightly
    pull_policy: missing
    container_name: lidarr
    restart: unless-stopped
    ports:
      - 8686:8686
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/lidarr:/config
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8686/ping
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - servarr_bridge
networks:
  servarr_bridge:
    external: true
