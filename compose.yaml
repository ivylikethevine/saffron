---

services:
  dockge:
    image: louislam/dockge:1.5.0
    pull_policy: missing
    container_name: dockge
    labels:
      homepage.group: Infrastructure
      homepage.name: Dockge
      homepage.icon: dockge.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:5001
      homepage.description: Stack manager
    restart: always
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - 5001:5001
    environment:
      - DOCKGE_STACKS_DIR=/home/$USER/saffron/stacks
      - USER=$USER # to pass down to use in other stacks
      - HOMEPAGE_HOST=${HOMEPAGE_HOST:-localhost} # host browsers use in homepage links; passed down to stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /containers/dockge/data:/app/data
      - /home/$USER/saffron/stacks:/home/$USER/saffron/stacks
      - /etc/localtime:/etc/localtime:ro