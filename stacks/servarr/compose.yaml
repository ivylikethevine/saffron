services:
  radarr:
    image: linuxserver/radarr:6.4.4
    pull_policy: missing
    container_name: radarr
    labels:
      homepage.group: Media Management
      homepage.name: Radarr
      homepage.icon: radarr.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:7878
      homepage.description: Movies
    restart: unless-stopped
    ports:
      - 7878:7878
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/radarr:/config
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:7878/ping
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bridge
  bookshelf:
    # Readarr is retired upstream; bookshelf is its maintained fork. The
    # softcover tag keeps Readarr's Goodreads metadata and reads the existing
    # Readarr config directory in place.
    image: ghcr.io/pennydreadful/bookshelf:softcover-v0.4.21.182
    pull_policy: missing
    container_name: bookshelf
    labels:
      homepage.group: Media Management
      homepage.name: Bookshelf
      homepage.icon: readarr.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8787
      homepage.description: Ebooks
    restart: unless-stopped
    ports:
      - 8787:8787
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/readarr/config:/config
      - /containers/readarr/books:/books
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8787/ping
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bridge
  sonarr:
    image: linuxserver/sonarr:4.0.20
    pull_policy: missing
    container_name: sonarr
    labels:
      homepage.group: Media Management
      homepage.name: Sonarr
      homepage.icon: sonarr.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8989
      homepage.description: TV
    restart: unless-stopped
    ports:
      - 8989:8989
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/sonarr:/config
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8989/ping
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bridge
networks:
  bridge:
    driver: bridge
