services:
  dozzle:
    container_name: dozzle
    labels:
      homepage.group: Infrastructure
      homepage.name: Dozzle
      homepage.icon: dozzle.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:9999
      homepage.description: Container logs
    image: amir20/dozzle:v11.3.2
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    environment:
      DOZZLE_NO_ANALYTICS: true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - /dozzle
        - healthcheck
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
