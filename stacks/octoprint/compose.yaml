services:
  octoprint:
    image: octoprint/octoprint:1.11.8
    container_name: octoprint
    labels:
      homepage.group: Home
      homepage.name: OctoPrint
      homepage.icon: octoprint.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:85
      homepage.description: 3D printer
    ports:
      - 85:80
    volumes:
      - /containers/octoprint:/octoprint
    privileged: true
    extends:
      file: ../common.yaml
      service: base-settings
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:80/
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
