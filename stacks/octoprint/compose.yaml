version: "3.8"
services:
  octoprint:
    image: octoprint/octoprint:1.11.8
    pull_policy: missing
    container_name: octoprint
    restart: always
    ports:
      - 85:80
    volumes:
      - /containers/octoprint:/octoprint
    privileged: true
    extends:
      file: ../common.yaml
      service: base-settings
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
