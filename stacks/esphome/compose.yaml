services:
  esphome:
    image: esphome/esphome:2026.9.1
    container_name: esphome
    labels:
      homepage.group: Home
      homepage.name: ESPHome
      homepage.icon: esphome.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:6052
      homepage.description: IoT devices
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/esphome/config:/config
    ports:
      - 6052:6052
    privileged: true
    deploy:
      resources:
        limits:
          memory: 512M
networks: {}
