services:
  watchyourlan:
    image: aceberg/watchyourlan:2.1.4
    pull_policy: missing
    container_name: watchyourlan
    restart: unless-stopped
    network_mode: host
    ports:
      - 8840:8840
    environment:
      IFACES: ${IFACES:-eth0}
    volumes:
      - /containers/watchyourlan/data:/data/WatchYourLAN
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - --timeout=2
        - http://localhost:8840/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
networks: {}
