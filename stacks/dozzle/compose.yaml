services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v10.7.2
    pull_policy: missing
    restart: unless-stopped
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    environment:
      DOZZLE_NO_ANALYTICS: true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - /dozzle
        - healthcheck
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
