services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    container_name: homeassistant
    labels:
      homepage.group: Home
      homepage.name: Home Assistant
      homepage.icon: home-assistant.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8123
      homepage.description: Automation
    privileged: true
    ports:
      - 8123:8123
    volumes:
      - /containers/homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    extends:
      file: ../common.yaml
      service: base-settings
    deploy:
      resources:
        limits:
          memory: 1.5G
    network_mode: host
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8123/
