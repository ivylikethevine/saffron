version: "3.8"
services:
  radarr:
    image: linuxserver/radarr:6.3.0
    pull_policy: missing
    container_name: radarr
    restart: always
    ports:
      - 7878:7878
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/radarr:/config
    networks:
      - bridge
  readarr:
    image: linuxserver/readarr:0.4.19-nightly
    pull_policy: missing
    container_name: readarr
    restart: always
    ports:
      - 8787:8787
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/readarr/config:/config
      - /containers/readarr/books:/books
    networks:
      - bridge
  sonarr:
    image: linuxserver/sonarr:4.0.19
    pull_policy: missing
    container_name: sonarr
    restart: always
    ports:
      - 8989:8989
    extends:
      file: ../common.yaml
      service: media-access
    volumes:
      - /containers/sonarr:/config
    networks:
      - bridge
networks:
  bridge:
    driver: bridge
