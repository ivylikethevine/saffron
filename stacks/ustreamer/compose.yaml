services:
  ustreamer:
    image: pikvm/ustreamer:v6.66
    container_name: ustreamer
    extends:
      file: ../common.yaml
      service: base-settings
    labels:
      homepage.group: Home
      homepage.name: uStreamer
      homepage.icon: mdi-cctv
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8083
      homepage.description: IP camera
    devices:
      - /dev/video0:/dev/video0
    ports:
      - 8083:8080
    command: ustreamer --device /dev/video0 -b 32 -w 32 -r 1280x720 -q 60
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
