services:
  plex:
    image: linuxserver/plex:1.43.4
    container_name: plex
    labels:
      homepage.group: Media
      homepage.name: Plex
      homepage.icon: plex.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:32400
      homepage.description: Media server
    network_mode: host
    environment:
      VERSION: docker
    devices:
      - /dev/dri:/dev/dri # for intel hardware decode
    extends:
      file: ../common.yaml
      service: media-access
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - /containers/plex:/config
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:32400/identity
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    labels:
      homepage.group: Media
      homepage.name: Seerr
      homepage.icon: jellyseerr.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:5055
      homepage.description: Requests
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/overseerr/config:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - --timeout=2
        - http://localhost:5055/api/v1/status
    networks:
      - servarr_bridge
networks:
  servarr_bridge:
    external: true
