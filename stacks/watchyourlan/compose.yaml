services:
  watchyourlan:
    image: aceberg/watchyourlan:2.1.4
    pull_policy: missing
    container_name: watchyourlan
    labels:
      homepage.group: Infrastructure
      homepage.name: WatchYourLAN
      homepage.icon: watchyourlan.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8840
      homepage.description: LAN devices
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - 8840:8840
    environment:
      IFACES: ${IFACES:-eth0}
    volumes:
      - /containers/watchyourlan/data:/data/WatchYourLAN
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - --timeout=2
        - http://localhost:8840/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
networks: {}
