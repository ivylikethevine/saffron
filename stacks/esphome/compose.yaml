version: "3.8"
services:
  esphome:
    image: esphome/esphome:2026.7.4
    pull_policy: missing
    container_name: esphome
    restart: unless-stopped
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/esphome/config:/config
    ports:
      - 6052:6052
    privileged: true
networks: {}
