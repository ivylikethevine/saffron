services:
  heimdall:
    image: linuxserver/heimdall:2.8.3
    container_name: heimdall
    labels:
      homepage.group: Infrastructure
      homepage.name: Heimdall
      homepage.icon: heimdall.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:80
      homepage.description: Dashboard
    extends:
      file: ../common.yaml
      service: base-settings
    ports:
      - 80:80
      - 443:443
    volumes:
      - /containers/heimdall:/config
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:80/
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
