services:
  speedtest-tracker:
    image: linuxserver/speedtest-tracker:1.15.0
    pull_policy: missing
    container_name: speedtest-tracker
    labels:
      homepage.group: Infrastructure
      homepage.name: Speedtest Tracker
      homepage.icon: speedtest-tracker.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8011
      homepage.description: Bandwidth history
    restart: unless-stopped
    ports:
      - 8011:80
    environment:
      - DB_CONNECTION=sqlite
      - APP_KEY=$APP_KEY
      - APP_URL=$APP_URL
      - SPEEDTEST_SCHEDULE=0 */6 * * *
    #     - SPEEDTEST_SERVERS=52365,36998,52365
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/speedtest-tracker/config:/config
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:80/api/healthcheck
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - saffron_default
networks:
  saffron_default:
    external: true
