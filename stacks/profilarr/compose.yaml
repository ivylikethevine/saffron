version: "3.8"
services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.1.0
    pull_policy: missing
    container_name: profilarr
    ports:
      - 6868:6868
    volumes:
      - /containers/profilarr/config:/config
    networks:
      - servarr_bridge
    extends:
      file: ../common.yaml
      service: media-access
    restart: unless-stopped
    environment:
      - PARSER_HOST=parser
      - PARSER_PORT=5000
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      parser:
        condition: service_healthy
  # Optional - only needed for CF/QP testing
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.1.0
    pull_policy: missing
    container_name: profilarr-parser
    restart: unless-stopped
    expose:
      - "5000"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - --timeout=2
        - http://localhost:5000/health
      start_period: 15s
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  servarr_bridge:
    external: true
