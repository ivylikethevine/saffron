services:
  navidrome:
    image: deluan/navidrome:0.64.2
    pull_policy: missing
    container_name: navidrome
    labels:
      homepage.group: Media
      homepage.name: Navidrome
      homepage.icon: navidrome.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:4533
      homepage.description: Music streaming
    restart: unless-stopped
    ports:
      - 4533:4533
    extends:
      file: ../common.yaml
      service: media-access
    environment:
      - ND_MUSICFOLDER=/data/music
      - ND_DATAFOLDER=/navidrome/data
      - ND_LASTFM_APIKEY=${ND_LASTFM_APIKEY}
      - ND_LASTFM_SECRET=${ND_LASTFM_SECRET}
    volumes:
      - /containers/navidrome/data:/navidrome/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:4533/ping
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  servarr_bridge:
    external: true
