services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1
    pull_policy: missing
    container_name: backrest
    labels:
      homepage.group: Infrastructure
      homepage.name: Backrest
      homepage.icon: backrest.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:9898
      homepage.description: Backups
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/backrest/data:/data
      - /containers/backrest/config:/config
      - /containers/backrest/cache:/cache
      - /containers/backrest/tmp:/tmp
      - /containers/:/userdata/containers
      - ${HOME}/saffron:/userdata/saffron
      - /data/tv:/userdata/tv
      - /data/movies:/userdata/movies
      - /data/music:/userdata/music
      - /data/backrest:/restore
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
    ports:
      - 9898:9898
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:9898/
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
networks: {}
