services:
  slskd:
    image: slskd/slskd:0.26.1
    pull_policy: missing
    container_name: slskd
    labels:
      homepage.group: Downloads
      homepage.name: slskd
      homepage.icon: slskd.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:5030
      homepage.description: Soulseek over VPN
    restart: unless-stopped
    network_mode: container:bitmagnet-gluetun
    extends:
      file: ../common.yaml
      service: media-access
    environment:
      SLSKD_REMOTE_CONFIGURATION: true
    #    SLSKD_UMASK: 22
#    user: 1000:1000
    volumes:
      - /containers/slskd:/app
      - /data/slskd:/data/slskd
      - /data/music:/shared
networks: {}
