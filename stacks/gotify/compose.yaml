
services:
  gotify:
    image: gotify/server:3.1.1
    pull_policy: missing
    container_name: gotify
    labels:
      homepage.group: Infrastructure
      homepage.name: Gotify
      homepage.icon: gotify.png
      homepage.href: http://${HOMEPAGE_HOST:-localhost}:8321
      homepage.description: Notifications
    restart: unless-stopped
    ports:
      - 8321:80
    extends:
      file: ../common.yaml
      service: base-settings
    volumes:
      - /containers/gotify:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
networks: {}